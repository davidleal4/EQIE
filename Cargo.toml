[package]
name = "eqie_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "eqie_engine"
crate-type = ["cdylib"] 

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# FIX: Upgraded to 0.22 to natively support Python 3.13
pyo3 = { version = "0.22", features = ["extension-module"] }